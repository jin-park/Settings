<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rubato</title>
    <link rel="stylesheet" href="style.css">
</head>

<body style='background-color: rgb(252, 250, 250);'>
    <div class="button-area">
        <button id="connectButton" onclick="connectToDevice()">Connect</button>
        <button id="connectButton" onclick="disconnectBluetooth()">Disconnect</button>
    </div>
    <h1>Rubato</h1>
    <div class="settings">
        재생속도
        <div class="slidecontainer">
            <br>
            <input type="range" min="0.00" max="1" step='0.1' value="0.5" class="slider" id="myRange">
            <p class="speed_value"><span id="demo"></span></p>
        </div>
    </div>

    <br>
    <div class="settings" id="touch-control">
        터치 컨트롤
        <label class="switch">
            <input type="checkbox" id = "touch-main">
            <span class="slider2"></span>
        </label>
    </div>
    <br>

    <div id="touch-control-panel" class="hidden">
        <div class='settings-child'>
            <label class="switch">
                <input type="checkbox" id="10">
                <span class="slider2"></span>
            </label>
            한번 탭
            <br>
            <p class='touch_control'>연습 중단</p>
        </div>
        <br>
        <div class='settings-child'>
            <label class="switch">
                <input type="checkbox"  id="11">
                <span class="slider2"></span>
            </label>
            두번 탭
            <br>
            <p class='touch_control'>다음 마디로 이동</p>
        </div>
        <br>
        <div class='settings-child'>
            <label class="switch">
                <input type="checkbox"  id="12">
                <span class="slider2"></span>
            </label>
            세번 탭
            <br>
            <p class='touch_control'>이전 마디로 이동</p>
        </div>
        <br>
        <div class='settings-child'>
            <label class="switch">
                <input type="checkbox" id="13">
                <span class="slider2"></span>
            </label>
            길게 누르기
            <br>
            <p class='touch_control'>연습 그만하기</p>
        </div>
        <br>
    </div>

    <div class="settings" id="midi-settings">
        악보 재생 방법
    </div>
    <br>

    <div id="midi-settings-panel" class="hidden">
        <div class='settings-child'>
            화음 분리 재생
            <label class="switch">
                <input type="checkbox" id="20">
                <span class="slider2"></span>
            </label>
        </div>
        <br>
        <div class='settings-child'>
            왼손, 오른손 분리 재생
            <label class="switch">
                <input type="checkbox"  id="21">
                <span class="slider2"></span>
            </label>
        </div>
        <br>

    </div>

    <div class="settings" id="practice-unit">
        연습 단위
    </div>
    <br>

    <div id="practice-unit-panel" class="hidden">
        <div class='settings-child touchable' id = 30>
            1마디
        </div>
        <br>
        <div class='settings-child touchable' id = 31>
            2마디
        </div>
        <br>
        <div class='settings-child touchable' id = 32>
            4마디
        </div>
        <br>
        <div class='settings-child touchable' id = 33> 
            8마디
        </div>
        <br>
        <div class='settings-child touchable' id = 34>
            1페이지
        </div>
        <br>
    </div>

    <script src='index.js'></script>
</body>

</html>
